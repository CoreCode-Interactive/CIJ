<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM_OVERRIDE</title>
    <style>
        /* Mobile-friendly resets */
        * {
            box-sizing: border-box;
        }
        
        body {
            background-color: #0a0a0a;
            color: #33ff33;
            font-family: 'Courier New', Courier, monospace;
            padding: 10px; 
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        #terminal {
            width: 100%;
            max-width: 800px;
            margin: auto; 
            background-color: #000;
            border: 1px solid #33ff33;
            box-shadow: 0 0 15px rgba(51, 255, 51, 0.4);
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            max-height: 85vh; 
        }
        
        #output {
            flex-grow: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-bottom: 10px;
            line-height: 1.4;
            font-size: 14px; 
        }

        /* Keeps the link matching the terminal color scheme */
        #output a {
            color: #33ff33;
            text-decoration: underline;
            font-weight: bold;
        }
        #output a:hover {
            color: #fff;
        }
        
        #input-line {
            display: flex;
            align-items: center;
            border-top: 1px dashed #33ff3333; 
            padding-top: 10px;
        }
        
        #prompt {
            color: #33ff33;
            margin-right: 10px;
            font-weight: bold;
            font-size: 14px;
            white-space: nowrap; 
        }
        
        #user-input {
            background: transparent;
            border: none;
            color: #33ff33;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px; 
            flex-grow: 1;
            outline: none;
            padding: 0;
            margin: 0;
            width: 100%;
        }
        
        /* Custom scrollbar for retro look */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #33ff33; border-radius: 4px; }
    </style>
</head>
<body>

<div id="terminal">
    <div id="output"></div>
    <div id="input-line">
        <span id="prompt">ARCHITECT_SYS_>$</span>
        <input type="text" id="user-input" autofocus autocomplete="off" autocapitalize="off">
    </div>
</div>

<script>
const output = document.getElementById('output');
const userInput = document.getElementById('user-input');
const terminal = document.getElementById('terminal');
const inputLine = document.getElementById('input-line');

// Inside joke or memory password 
const SECRET_PASSWORD = "no wifi elders + little ones"; 

const bootLines = [
    "LOG_IN: USER_E_D",
    "CRITICAL: INTERNAL_SECURITY_COMPROMISED",
    "LEAK_DETECTED: PLANS LEAKED",
    "--------------------------------------------------------------",
    "THE ARCHITECT PROTOCOL HAS RE-ROUTED SURPRISE.",
    "YOU KNOW THE STAGE, BUT YOU DO NOT KNOW THE PLAYERS.",
    "THE NEW SURPRISE IS READY AND WAITING.",
    "WHAT'S AT THE END OF THE JOURNEY?",
    "ANSWER SECURITY QUESTION TO ACCESS TICKET DATA",
    "ANSWER THE QUESTION BY PROVIDING THE CORRECT LETTER",
    "1. What did you call me after stealing a chip at the first ftx?",
    "A) Stubborn",
    "B) Cadet Moise",
    "C) Oblivious",
    "D) Nice",
    " "
];

const answers = [
    "a", // Answer to Q1
    "b", // Answer to Q2
    "a", // Answer to Q3
    "d", // Answer to Q4
    "d", // Answer to Q5
    "a", // Answer to Q6
    "c", // Answer to Q7
    "d"  // Answer to Q8
];

let answerIndex = 0;

const nextQuestion = [
    [
        "2. What was the date we first held hands?",
        "A) February 14th",
        "B) February 21st",
        "C) February 28th",
        "D) March 7th",
        " "
    ], 
    [
        "3. What did my family first think of you tracking my flights?",
        "A) They thought it was weird",
        "B) They thought it was sweet",
        "C) They thought it was nerdy",
        "D) They didn't care",
        " "
    ],
    [
        "4. Who was I scared of meeting in your family? (Choose the most correct answer)",
        "A) Your mom",
        "B) Your dad",
        "C) Your brother",
        "D) All of the above",
        " "
    ],
    [
        "5. What does sandwiches mean in the context of us?",
        "A) A sandwich we both shared",
        "B) A reference to star wars",
        "C) A code word for not liking food",
        "D) A reference to frozen",
        " "
    ],
    [
        "6. Who consulted us for relationship advice?",
        "A) The no wifi elders + the little ones",
        "B) OWW",
        "C) The anders",
        "D) The crew",
        " "
    ],
    [
        "7. Since when did I know I like you?",
        "A) Since my first ftx",
        "B) Since the first cadets movie night",
        "C) Since my first time gliding with cadets",
        "D) Since Christmas of 2024",
        " "
    ],
    [
        "8. What was the excuse for me to come over on valentine's day?",
        "A) Gabriel would be gone that day",
        "B) We would be able to play uno",
        "C) I wasn't able to come the next day",
        "D) The cake pops would have been gone the next day",
        " "
    ]
];

let lineIndex = 0;

function printLines(lines) {
    // Hide the input line entirely while the machine is "typing" out text
    inputLine.style.visibility = 'hidden';
    userInput.disabled = true;

    if (lineIndex < lines.length) {
        output.innerHTML += lines[lineIndex] + "\n";
        lineIndex++;
        output.scrollTop = output.scrollHeight;
        setTimeout(() => printLines(lines), 800); 
    } else {
        lineIndex = 0; // Reset index seamlessly
        
        // Bring the input box back and focus it only when text printing is complete
        inputLine.style.visibility = 'visible';
        userInput.disabled = false;
        userInput.focus();
    }
}

terminal.addEventListener('click', function() {
    if (!userInput.disabled) {
        userInput.focus();
    }
});

userInput.addEventListener('keydown', function(event) {
    if (event.key === 'Enter') {
        const command = userInput.value.trim().toLowerCase();
        
        output.innerHTML += `\n<span style="color: #fff;">ARCHITECT_SYS_>$ ${command.toUpperCase()}</span>\n`;
        
        if (command === answers[answerIndex]) {
            answerIndex++;
            if (answerIndex <= nextQuestion.length) {
                printLines(nextQuestion[answerIndex - 1]);
            } else {
                output.innerHTML += `<span style="color: #33ff33;">\nACCESS GRANTED. DECRYPTION COMPLETE.\nTICKET DATA UNLOCKED: <a href="Screenshot 2026-06-03 5.53.07 PM.png" target="_blank">CLICK TO CLAIM TICKET</a></span>\n\n`;
                userInput.disabled = true;
                inputLine.style.display = 'none';
            }
        } else {
            output.innerHTML += `<span style="color: #ff3333;">ACCESS DENIED: INSUFFICIENT PERMISSIONS. OBLIVIOUS STATUS ACTIVE.</span>\n\n`;
        }
        
        userInput.value = '';
        setTimeout(() => {
            output.scrollTop = output.scrollHeight;
        }, 50);
    }
});

// Initialize sequence on page load
printLines(bootLines);
</script>

</body>
</html>
